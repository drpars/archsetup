resume_nvidia_in_initramfs = "The initramfs carries the NVIDIA drivers: {modules}. They load in the resume kernel too, and there no systemd unit has written /proc/driver/nvidia/suspend to save VRAM, so the driver refuses to freeze (nv_pmops_freeze -> -5) and the restore unwinds AFTER the image has been read back in full. From outside that reads as 'hibernation just doesn't work'. Measured on this laptop: taking them out of MODULES made the same machine hibernate and come back on the same boot id."
