not_applied = "The rule was written but one of its two halves did not take: the NIC should be auto and the bridge on. Check it with: udevadm test /sys/bus/pci/devices/<address> ({path})"
done = "Ethernet power saving is on. The NIC autosuspends about 10 s after the link drops while its root port stays awake -- measured on this hardware: a sleeping root port never delivers the NIC's PME, which is why a cable went unnoticed, and pinning the port fixes it for 0.64 W. That is 0.88 W saved against the Arch default with cable detection intact. The Ethernet Power Saving (Off) task puts it back."
already_off = "Ethernet power saving is already off (NIC on, bridge unpinned) and there is no rule to remove; nothing to change."
disable_plan = "This removes {path} and writes power/control=on to the NIC and auto to its bridge, both effective at once. That is a return to the Arch default, and the cost is measured: 0.88 W more at idle. Cable detection works either way, so what you give up is battery only."
disable_q = "Turn ethernet power saving off (back to the Arch default)?"
