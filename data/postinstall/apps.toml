# The odd one out on purpose: every other category groups by topic, this one
# groups by "what yazi needs to work". That is why six of these names appear
# in a topical category as well (7zip, fd, fzf, jq, ripgrep, zoxide) -- the
# only duplication in this file. It costs nothing, every install path runs
# pacman -S --needed, and it is what makes one screen enough for a working
# yazi. The label says which axis this is; do not rename it back to
# "extras", none of these packages is a yazi plugin. The plugins are Lua
# files in dotfiles, and these are the binaries they shell out to.
