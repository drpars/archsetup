  # extra/qt6ct, preselected as of 2026-08-28. This slot used to hold the AUR
  # fork qt6ct-kde, against the repo-first rule; the fork was dropped after its
  # own rationale was measured out from under it (dotfiles, 2026-08-27). The
  # entry has to stay ticked either way: dotfiles exports
  # QT_QPA_PLATFORMTHEME=qt6ct, so unticking it leaves Qt with no platform
  # theme at all. What the patch added, and where each half went:
  #   * QQuickStyle::setStyle("org.kde.desktop") for QML applications. Measured
  #     on the only QML consumer this desktop has, hyprpolkitagent's password
  #     prompt, captured under both packages: same geometry, and every differing
  #     pixel accounted for -- a blinking text cursor, one channel of edge
  #     antialiasing, corner blur. No systematic colour change, because the
  #     prompt takes its style from hyprland-qt-support, whose HyprlandStyle.qml
  #     derives colour from ColorGroup, that is QPalette, not KColorScheme.
  #     Scope: a real Kirigami.Theme application was never tried, and that one
  #     still feeds from KColorScheme -> kdeglobals.
  #   * loadColorScheme() accepting a KDE .colors file. Dead: dotfiles points
  #     color_scheme_path at a native TokyoNight.conf and has custom_palette
  #     off, so nothing asks for the .colors path any more.
  #   * A KDE icon engine: the patched libqt6ct.so overrode createIconEngine
  #     with KIconEngine. This half still stands and is STILL NOT MEASURED.
  #     What is known is only that icon_theme visibly applies under plain
  #     qt6ct. Measuring it means putting the AUR fork back for an A/B, which
  #     is why the swap was not made to wait on it.
  # The cost that decided it, ldd on the platform theme plugin: the patched
  # libqt6ct.so pulled in eight KF6 libraries (KF6IconThemes, KF6Archive,
  # KF6ColorScheme, KF6BreezeIcons, KF6I18n, KF6ConfigCore, KF6ConfigGui,
  # KF6GuiAddons). Miss one KF6 soname bump without a rebuild and the platform
  # theme does not load at all -- the whole Qt look goes, no error, no exit
  # code. Plain qt6ct links zero of them (measured again here on 2026-08-28).
  #
  # Order trap, for a machine that already runs the fork: point
  # color_scheme_path at the native .conf FIRST, swap the package SECOND. The
  # native parser finds no [ColorScheme] group in a .colors file and falls back
  # to the Qt default -- Highlight #308cc6, Window #efefef, a light desktop.
  # Loud rather than silent, but still the wrong way round. In the right order
  # the swap is a measured no-op: the same probe rendered byte-identical PNGs
  # under both packages.
  [[category.packages]]
  name = "qt6ct"
  note = { tr = "Qt6 yapılandırması", en = "Qt6 config" }

