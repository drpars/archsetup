  post_msg = "msg.virt_config_hint"

  # iptables-nft was merged into iptables, which provides and replaces it.
  # libvirt still wants the iptables interface for NAT networking; the repo
  # package speaks it while writing nftables rules underneath.
  [[category.packages]]
  name = "iptables"
  note = { tr = "Çekirdek paket filtresi (libvirt ağı buna dayanır)", en = "Kernel packet filter (libvirt networking rests on it)" }

