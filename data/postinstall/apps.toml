  name = "dmidecode"
  note = { tr = "DMI/SMBIOS tablolarını okur (donanım kimliği)", en = "Reads DMI/SMBIOS tables (hardware identity)" }

  [[category.packages]]
  name = "qemu-desktop"
  note = { tr = "QEMU — masaüstü kullanımına göre derlenmiş", en = "QEMU — built for desktop use" }

