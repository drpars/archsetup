  note = { tr = "Misafirin ekranına bağlanan hafif görüntüleyici", en = "Lightweight viewer for a guest's display" }

  # UEFI guests need OVMF firmware, and qemu-desktop does not depend on it.
  # Without this, creating a UEFI VM fails at firmware selection.
  [[category.packages]]
  name = "edk2-ovmf"
  note = { tr = "UEFI misafirler için OVMF ürün yazılımı", en = "OVMF firmware for UEFI guests" }

  [[category.packages]]
  name = "swtpm"
  note = { tr = "Yazılım TPM öykünücüsü (Windows 11 ister)", en = "Software TPM emulator (Windows 11 wants one)" }

  # xorriso ships in libisoburn, and nothing here depended on it directly:
  # measured 2026-08-05, the only chain was virt-manager -> virt-install ->
  # libisoburn. That leaves ISO authoring riding on a GUI staying selected,
  # and virt-manager is exactly what someone driving virsh from a terminal
  # deselects. The break would show up late and in the wrong place -- machine
  # installed, host configured, and the first guest build stopping at
  # "'xorriso' bulunamadi". 2 MiB installed, so the entry is cheaper than the
  # question of whether the chain still holds.
  [[category.packages]]
  name = "libisoburn"
  note = { tr = "xorriso — misafir için ISO üretir (gözetimsiz kurulum)", en = "xorriso -- authors ISOs for guests (unattended install)" }

  [[category.packages]]
  name = "virtiofsd"
  note = { tr = "Host ↔ misafir klasör paylaşımı", en = "Host to guest folder sharing" }
  default = false

  # A Windows guest cannot see a virtio disk during setup, so the installer
  # shows an empty drive list until these drivers are loaded from an attached
  # ISO. The package is nothing but the ISO: no build, no install script, just
  # install -Dm644 into /var/lib/libvirt/images, where the directory is 0755
  # and the file 0644 -- readable by the user qemu runs as, with no task to
  # write. That is why this is a catalogue entry and not one.
  #
  # Off by default because it is a 753 MiB download that only a Windows guest
  # ever needs. The version is pinned in the PKGBUILD (_ver=0.1.285), so the
  # ISO only moves when the maintainer moves it; today it matches upstream's
  # stable-virtio. If it ever goes stale, the direct download is at
  # https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/
  [[category.packages]]
  name = "virtio-win"
  aur = true
  default = false
  post_msg = "msg.virtio_win_hint"
  note = { tr = "Windows misafirler için virtio sürücü ISO'su (753 MB)", en = "virtio driver ISO for Windows guests (753 MB)" }

  # Looking Glass used to be a task here, because the packages leave four
  # things undone: the kvmfr module, its size, /dev/kvmfr0 permissions and
  # libvirt's device ACL. All four now belong to vfioctl, which owns the whole
  # passthrough host side, so nothing is left for archsetup to do after pacman
  # returns -- and by this file's own rule that makes it a catalogue entry, not
  # a task (same reasoning as virtio-win above).
  #
  # Off by default: the client is useless without a guest that has the card,
  # and the DKMS module builds a kernel module on every kernel update. That
  # build needs the headers for the running kernel, which no package pulls in
  # (linux-zen-headers on this machine) -- a DKMS package installs happily
  # without them and fails silently. Same accepted gap as acpi_call-dkms.
  [[category.packages]]
  name = "looking-glass"
  aur = true
  default = false
  post_msg = "msg.looking_glass_hint"
  note = { tr = "Misafirin ekranını düşük gecikmeyle gösteren istemci", en = "Client showing the guest's screen with low latency" }

  [[category.packages]]
  name = "looking-glass-module-dkms"
  aur = true
  default = false
  note = { tr = "kvmfr çekirdek modülü (DKMS; çekirdek başlıkları gerekir)", en = "kvmfr kernel module (DKMS; needs the kernel headers)" }

  # bridge-utils is gone from the repos: brctl was superseded by iproute2 and
  # libvirt manages bridges over netlink. Listing it aborted the whole
  # virtualization install with "target not found".

# Grouped with `virtualization` above (group = "virt"): both screens stay
# exactly as they are, but the Applications list shows one row for the pair
# instead of two siblings that read as alternatives. The relation -- same
# packages, two axes, one a requirement subset of the other -- has nowhere
# else to be said; adjacency does not say it.
#
# The second category on the requirement axis, same shape as yazi_extras: not
# a topic but "what a working GPU passthrough needs". Every name here also
# lives in `virtualization` above, and that duplication is the point -- the
# set was already installable there, spread across fourteen entries with the
# three that matter most arriving switched off. Whoever wants passthrough had
# to know the names before the catalogue would show them.
#
# Why a category and not a sentence in a note: a sentence listing package
# names goes stale silently, a category whose membership *is* the list cannot.
# Same reason yazi's post_msg points at a category instead of naming binaries.
#
# Why everything defaults on here while the same entries default off above:
# the axis decides. In `virtualization` they are options a general VM user
# mostly does not want (753 MiB of Windows drivers, a client with no card to
# show). On this screen they are requirements, and the user opened it after
# deciding on passthrough. The costs stay visible in each note, and anything
# can still be deselected -- what is gone is having to find them first.
#
# What is deliberately absent: virt-manager and virt-viewer. vfioctl drives
# virsh, so the GUI is convenience here, not a requirement; listing it would
# reintroduce exactly the dependency this file just unwound (see libisoburn).
#
# archsetup's half ends with pacman. The kvmfr module and its size,
# /dev/kvmfr0 permissions, libvirt's device ACL, the handover hook, the vfio
# binding -- all of that is vfioctl's, and the note below is where that split
# is finally written on a surface a user can read, rather than only in code
# comments and a post_msg.
#
# The note names the task rather than the repository URL. An address answers
# "where", and whoever reads it still has to work out that the answer is a
# clone and a makepkg; the task is the answer to "how", and archsetup has run
# it for yay-bin since the beginning. The URL still exists -- it is in the
# task's own description, one screen away.
[[category]]
id = "passthrough"
group = "virt"
note = { tr = "Paketler burada biter; gerisi vfioctl'de → Yapılandırma > Sanallaştırma > 'vfioctl Kurulumu'", en = "Packages end here; the rest is vfioctl's -> Configuration > Virtualization > 'Install vfioctl'" }

