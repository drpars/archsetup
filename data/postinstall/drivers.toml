# Driver categories. Kernel module configuration (mkinitcpio, modeset)
# lives in the nvidia-modules / amd-modules tasks shown in the same menu,
# ASUS ROG/TUF tooling in asus-tools, and hybrid-laptop NVIDIA power
# management (S0ix, runtime PM, suspend services) in nvidia-laptop-power.

[[category]]
id = "amd"
condition = "gpu:amd"

  [[category.packages]]
  name = "mesa"
  post_msg = "msg.gpu_modules_hint"

  [[category.packages]]
  name = "lib32-mesa"

  [[category.packages]]
  name = "xf86-video-amdgpu"
  note = { tr = "Yalnızca Xorg DDX; Wayland'de ve modesetting ile gereksiz", en = "Xorg DDX only; unused on Wayland and with modesetting" }
  default = false

  [[category.packages]]
  name = "vulkan-radeon"

  [[category.packages]]
  name = "lib32-vulkan-radeon"

  # VA-API comes from mesa/lib32-mesa themselves: they provide (and replace)
  # libva-mesa-driver, so naming it separately only duplicated the entry.
  #
  # mesa-vdpau and lib32-mesa-vdpau are gone for good — Mesa 25.3 dropped the
  # VDPAU state trackers in favour of VA-API. Listing them made every AMD
  # driver install abort with "target not found" before installing anything.

[[category]]
id = "nvidia"
condition = "gpu:nvidia"

  # The proprietary kernel modules (nvidia, nvidia-lts, nvidia-dkms) no longer
  # exist: with the 590 driver the main packages switched to the open kernel
  # modules and nvidia-open now Replaces them. Turing (RTX 20xx / GTX 1650)
  # and newer belong here. Pascal and older are unsupported by 590+ and need
  # the legacy branch below.

  [[category.packages]]
  name = "nvidia-open"
  note = { tr = "Açık çekirdek modülü, linux için", en = "Open kernel module, for linux" }
  default = false

  [[category.packages]]
  name = "nvidia-open-lts"
  note = { tr = "Açık çekirdek modülü, linux-lts için", en = "Open kernel module, for linux-lts" }
  default = false

  [[category.packages]]
  name = "nvidia-open-dkms"
  note = { tr = "Açık çekirdek modülü, tüm çekirdekler (DKMS)", en = "Open kernel module, any kernel (DKMS)" }

  [[category.packages]]
  name = "nvidia-580xx-dkms"
  aur = true
  note = { tr = "Pascal (GTX 10xx) ve öncesi: 590 desteği bıraktı", en = "Pascal (GTX 10xx) and older: dropped by 590" }
  default = false

  [[category.packages]]
  name = "nvidia-utils"
  post_msg = "msg.gpu_modules_hint"

  [[category.packages]]
  name = "lib32-nvidia-utils"

  [[category.packages]]
  name = "nvidia-settings"

  [[category.packages]]
  name = "egl-wayland"

  [[category.packages]]
  name = "libva-nvidia-driver"
  note = { tr = "VA-API donanım hızlandırma", en = "VA-API hardware acceleration" }

[[category]]
id = "openrazer"

  [[category.packages]]
  name = "openrazer-daemon"
  note = { tr = "Razer aygıtları için DBus servisi", en = "DBus service for Razer devices" }
  post_msg = "msg.plugdev_hint"

  [[category.packages]]
  name = "openrazer-driver-dkms"
  note = "DKMS"
  post_msg = "msg.reboot_required"

  [[category.packages]]
  name = "python-openrazer"
  note = { tr = "OpenRazer Python kütüphanesi", en = "OpenRazer Python library" }

[[category]]
id = "sound"

  [[category.packages]]
  name = "wireplumber"

  [[category.packages]]
  name = "pipewire"

  [[category.packages]]
  name = "pipewire-alsa"

  [[category.packages]]
  name = "pipewire-pulse"

  [[category.packages]]
  name = "pipewire-jack"

  [[category.packages]]
  name = "pipewire-v4l2"

  [[category.packages]]
  name = "pipewire-zeroconf"

  [[category.packages]]
  name = "pipewire-x11-bell"
  default = false

  [[category.packages]]
  name = "easyeffects"
  default = false
