# Extra packages installed into the target with arch-chroot pacman.
# Ported from installarch's archextrasmenu.

[[category]]
id = "extras"

  [[category.packages]]
  name = "intel-ucode"
  condition = "cpu:intel"

  [[category.packages]]
  name = "amd-ucode"
  condition = "cpu:amd"

  [[category.packages]]
  name = "sbctl"
  note = { tr = "Secure Boot imzalama", en = "Secure Boot signing" }

  [[category.packages]]
  name = "edk2-shell"

  # Kapalı: bir bellek testi yılda bir kez, somut bir şüphe üzerine koşulur.
  # Girdi yine de burada, çünkü asıl iş paketi kurmak değil ESP kopyası +
  # imza + boot girdisi; işaretlenirse kurucu üçünü de kendisi yapar.
  [[category.packages]]
  name = "memtest86+-efi"
  default = false
  note = { tr = "Bellek testi (boot menüsüne girdi ekler)", en = "Memory test (adds a boot menu entry)" }

  [[category.packages]]
  name = "efibootmgr"

  [[category.packages]]
  name = "iwd"
  note = { tr = "Kablosuz ağ (impala ile)", en = "Wireless networking (with impala)" }

  [[category.packages]]
  name = "dhcpcd"
  default = false

  [[category.packages]]
  name = "networkmanager"
  default = false

  [[category.packages]]
  name = "openssh"

  [[category.packages]]
  name = "git"

  # Not opsiyonel: sürümlenen bir pre-commit hook'u (core.hooksPath) gitleaks
  # çağırıyorsa, paketin olmadığı makinede commit "sızıntı var" gibi değil
  # anlaşılmaz bir hook hatasıyla düşer.
  [[category.packages]]
  name = "gitleaks"
  note = { tr = "Commit öncesi sır/anahtar taraması", en = "Scan for secrets and keys before commit" }

  [[category.packages]]
  name = "neovim"

  [[category.packages]]
  name = "xdg-user-dirs"

  [[category.packages]]
  name = "xdg-utils"

  [[category.packages]]
  name = "util-linux"

  [[category.packages]]
  name = "coreutils"

  [[category.packages]]
  name = "usbutils"

  [[category.packages]]
  name = "procps-ng"

  [[category.packages]]
  name = "samba"
  default = false

  [[category.packages]]
  name = "nfs-utils"

  [[category.packages]]
  name = "bind"

  [[category.packages]]
  name = "man-db"

  [[category.packages]]
  name = "man-pages"

  [[category.packages]]
  name = "eza"

  [[category.packages]]
  name = "bluez"

  [[category.packages]]
  name = "bluez-utils"
